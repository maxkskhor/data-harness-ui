[project]
name = "backend"
version = "0.1.0"
description = "Local FastAPI backend for data-harness-ui."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "data-harness[openai]>=1.3.1,<2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
